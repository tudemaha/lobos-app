<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Verify your email</title>
    <style>
        body {
            font-family: 'Garamond', Georgia, serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 24px;
            margin: 0;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 32px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        h2 {
            font-size: 20px;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 16px;
        }
        p {
            line-height: 1.6;
            color: #475569;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .btn-wrapper {
            text-align: center;
            margin: 32px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #70A3C9;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
        }
        .alt-link {
            font-size: 13px;
            color: #64748b;
            word-break: break-all;
            margin-top: 24px;
        }
        .alt-link a {
            color: #70A3C9;
            text-decoration: underline;
        }
        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">Lobos</div>
    <h2 th:text="${heading}">Verify your email</h2>
    <p th:text="${message}">Please verify your email address to continue.</p>

    <div class="btn-wrapper">
        <a th:href="${verificationUrl}" class="btn" th:text="${buttonText}">Verify</a>
    </div>

    <p class="alt-link">
        Or copy and paste this link in your browser:<br/>
        <a th:href="${verificationUrl}" th:text="${verificationUrl}">http://localhost:8080/verify-email?token=...</a>
    </p>

    <div class="footer">
        If you did not request this, you can safely ignore this email.
    </div>
</div>
</body>
</html>
