<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::head-extra}, ~{::main-content}, ~{::scripts})}">

<title>Reset Password — Lobos</title>

<th:block th:fragment="head-extra"></th:block>

<th:block th:fragment="main-content">
<div class="min-h-[calc(100vh-3.5rem-57px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">

        <!-- Heading -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-semibold text-gray-900 tracking-tight">Reset password</h1>
            <p class="mt-1 text-gray-500 text-base">Enter your new password below</p>
        </div>

        <!-- Error banner for invalid / expired token -->
        <div th:if="${errorMessage}" class="mb-6 bg-red-50 border border-red-200 rounded-md p-4 text-sm text-red-700">
            <p class="font-medium" th:text="${errorMessage}">The reset link is invalid or expired.</p>
            <div class="mt-3">
                <a th:href="@{/forgot-password}" class="text-xs font-semibold text-red-900 underline hover:text-red-950">
                    Request a new reset link
                </a>
            </div>
        </div>

        <!-- Form (visible only when token is valid) -->
        <form th:if="${tokenValid}"
              th:action="@{/auth/reset-password}"
              th:object="${resetPassword}"
              method="post"
              class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{token}"/>

            <!-- Global validation errors -->
            <div th:if="${#fields.hasErrors('*')}" class="mb-4 bg-red-50 border border-red-200 rounded-md px-4 py-3 text-sm text-red-600">
                <ul class="list-disc list-inside space-y-0.5">
                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                </ul>
            </div>

            <!-- New Password -->
            <div>
                <label for="reset-password-input" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <div class="relative">
                    <input id="reset-password-input"
                           type="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           required
                           placeholder="At least 8 characters"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 pr-10 text-base text-gray-900 placeholder-gray-400 focus-pastel transition"
                           th:classappend="${#fields.hasErrors('password')} ? ' border-red-400' : ''" />
                    <button type="button"
                            onclick="togglePwd('reset-password-input', 'eye-icon-pwd')"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                        <svg id="eye-icon-pwd" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"
                      class="text-xs text-red-500 mt-0.5 block"></span>
            </div>

            <!-- Confirm New Password -->
            <div>
                <label for="reset-confirm-pwd" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                <div class="relative">
                    <input id="reset-confirm-pwd"
                           type="password"
                           th:field="*{confirmPassword}"
                           autocomplete="new-password"
                           required
                           placeholder="••••••••"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 pr-10 text-base text-gray-900 placeholder-gray-400 focus-pastel transition"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? ' border-red-400' : ''" />
                    <button type="button"
                            onclick="togglePwd('reset-confirm-pwd', 'eye-icon-confirm')"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                        <svg id="eye-icon-confirm" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"
                      class="text-xs text-red-500 mt-0.5 block"></span>
            </div>

            <!-- Submit -->
            <button type="submit"
                    id="btn-reset-password"
                    class="btn-primary w-full text-center font-medium">
                Reset Password
            </button>
        </form>

        <!-- Back to login -->
        <p class="mt-6 text-center text-sm text-gray-500">
            Remember your password?
            <a th:href="@{/login}" class="pastel-blue font-medium hover:underline">Sign in</a>
        </p>
    </div>
</div>
</th:block>

<th:block th:fragment="scripts"></th:block>
</html>
