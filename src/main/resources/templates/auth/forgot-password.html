<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::head-extra}, ~{::main-content}, ~{::scripts})}">

<title>Forgot Password — Lobos</title>

<th:block th:fragment="head-extra"></th:block>

<th:block th:fragment="main-content">
<div class="min-h-[calc(100vh-3.5rem-57px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">

        <!-- Heading -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-semibold text-gray-900 tracking-tight">Forgot password?</h1>
            <p class="mt-1 text-gray-500 text-base">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <!-- Form -->
        <form th:action="@{/auth/forgot-password}" method="post" class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Email -->
            <div>
                <label for="forgot-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input id="forgot-email"
                       type="email"
                       name="email"
                       autocomplete="email"
                       required
                       placeholder="you@example.com"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-base text-gray-900 placeholder-gray-400 focus-pastel transition" />
            </div>

            <!-- Submit -->
            <button type="submit"
                    id="btn-forgot-password"
                    class="btn-primary w-full text-center font-medium">
                Send Reset Link
            </button>
        </form>

        <!-- Back to login -->
        <p class="mt-6 text-center text-sm text-gray-500">
            Remember your password?
            <a th:href="@{/login}" class="pastel-blue font-medium hover:underline">Sign in</a>
        </p>
    </div>
</div>
</th:block>

<th:block th:fragment="scripts"></th:block>
</html>
