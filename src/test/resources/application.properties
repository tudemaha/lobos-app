spring.application.name=lobos
spring.mvc.hiddenmethod.filter.enabled=true

spring.ai.mcp.server.name=lobos-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=streamable

spring.flyway.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lobos}
spring.datasource.username=${DB_USERNAME:dummy}
spring.datasource.password=${DB_PASSWORD:dummy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET:dummyjwtsecretkey123456789012345678901234567890}
jwt.access-ttl=15m
jwt.refresh-ttl=30d

app.remember-me.key=${REMEMBER_ME_KEY:dummyremembermekey1234567890}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.verification.ttl=24h
app.sync.tombstone-retention=${SYNC_TOMBSTONE_RETENTION:90d}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
